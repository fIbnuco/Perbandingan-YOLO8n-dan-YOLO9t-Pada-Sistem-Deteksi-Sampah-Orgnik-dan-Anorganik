<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasil Perbandingan Model</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">

<div class="container mt-5">

    <h1 class="text-center mb-4">
        Perbandingan YOLOv8n dan YOLOv9t
    </h1>

    <div class="row">

        <!-- YOLOV8 -->
        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header bg-primary text-white text-center">
                    <h4>YOLOv8n</h4>
                </div>

                <div class="card-body text-center">

                    <img
                        src="{{ image_v8 }}"
                        class="img-fluid rounded"
                    >

                    <hr>

                    <h5>Confidence Score</h5>

                    <table class="table table-bordered">

                        <thead class="table-dark">
                            <tr>
                                <th>No</th>
                                <th>Confidence</th>
                            </tr>
                        </thead>

                        <tbody>

                        {% for d in detections_v8 %}

                            <tr>
                                <td>{{ loop.index }}</td>
                                <td>{{ d.confidence }}</td>
                            </tr>

                        {% endfor %}

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

        <!-- YOLOV9 -->
        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header bg-success text-white text-center">
                    <h4>YOLOv9t</h4>
                </div>

                <div class="card-body text-center">

                    <img
                        src="{{ image_v9 }}"
                        class="img-fluid rounded"
                    >

                    <hr>

                    <h5>Confidence Score</h5>

                    <table class="table table-bordered">

                        <thead class="table-dark">
                            <tr>
                                <th>No</th>
                                <th>Confidence</th>
                            </tr>
                        </thead>

                        <tbody>

                        {% for d in detections_v9 %}

                            <tr>
                                <td>{{ loop.index }}</td>
                                <td>{{ d.confidence }}</td>
                            </tr>

                        {% endfor %}

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

    <div class="text-center mt-4">

        <a href="/" class="btn btn-primary">
            Deteksi Lagi
        </a>

        <a href="/history" class="btn btn-success">
            History Deteksi
        </a>

    </div>

</div>

</body>
</html>
